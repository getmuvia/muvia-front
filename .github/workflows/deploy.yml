name: Build and deploy

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload Firebase Hosting artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: firebase-hosting
          path: dist/itera-front/browser
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy demo
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.26.0

      - name: Download Firebase Hosting artifact
        uses: actions/download-artifact@v4
        with:
          name: firebase-hosting
          path: dist/itera-front/browser

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy Firebase Hosting release
        run: firebase deploy --only hosting --project "${PROJECT_ID}" --non-interactive

      - name: Check deployment health
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "https://${HOSTING_SITE}.web.app"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
