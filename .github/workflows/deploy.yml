name: Build and deploy

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate Firebase Hosting artifact
        shell: bash
        run: |
          set -euo pipefail

          hosting_dir="dist/itera-front/browser"

          test -f "${hosting_dir}/index.csr.html"
          grep --fixed-strings --quiet '<app-root' "${hosting_dir}/index.csr.html"

          main_bundle_count="$(find "${hosting_dir}" -maxdepth 1 -type f -name 'main-*.js' | wc -l)"
          test "${main_bundle_count}" -eq 1

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload Firebase Hosting artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: firebase-hosting
          path: dist/itera-front/browser
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy demo
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.26.0

      - name: Download Firebase Hosting artifact
        uses: actions/download-artifact@v4
        with:
          name: firebase-hosting
          path: dist/itera-front/browser

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy Firebase Hosting release
        run: firebase deploy --only hosting --project "${PROJECT_ID}" --non-interactive

      - name: Verify deployed release
        shell: bash
        run: |
          set -euo pipefail

          hosting_dir="dist/itera-front/browser"
          expected_main="$(basename "$(find "${hosting_dir}" -maxdepth 1 -type f -name 'main-*.js' -print -quit)")"
          hosting_site="$(node --print "require('./firebase.json').hosting.site")"
          site_url="https://${hosting_site}.web.app"
          routes=(home products auth/login seller)

          test -n "${expected_main}"
          test -n "${hosting_site}"

          echo "Verifying ${expected_main} on ${site_url}."

          for attempt in {1..36}; do
            release_is_healthy=true

            for route in "${routes[@]}"; do
              route_slug="${route//\//-}"
              headers_file="${RUNNER_TEMP}/${route_slug}.headers"
              body_file="${RUNNER_TEMP}/${route_slug}.html"
              request_url="${site_url}/${route}?release=${GITHUB_SHA}&attempt=${attempt}"

              if ! curl \
                --fail \
                --silent \
                --show-error \
                --header 'Cache-Control: no-cache, no-store, max-age=0' \
                --header 'Pragma: no-cache' \
                --dump-header "${headers_file}" \
                --output "${body_file}" \
                "${request_url}"; then
                echo "Attempt ${attempt}: route /${route} could not be fetched." >&2
                release_is_healthy=false
                break
              fi

              if ! grep --fixed-strings --quiet "${expected_main}" "${body_file}"; then
                served_main="$(grep --only-matching --extended-regexp 'main-[A-Za-z0-9_-]+\.js' "${body_file}" | head -n 1 || true)"
                echo "Attempt ${attempt}: route /${route} is serving ${served_main:-no main bundle}, expected ${expected_main}." >&2
                release_is_healthy=false
                break
              fi

              if ! grep --ignore-case --quiet '^cache-control:.*no-store' "${headers_file}"; then
                echo "Attempt ${attempt}: route /${route} is missing the no-store cache policy." >&2
                release_is_healthy=false
                break
              fi
            done

            if [[ "${release_is_healthy}" == 'true' ]]; then
              exit 0
            fi

            sleep 5
          done

          echo 'Firebase Hosting did not converge to the expected release.' >&2
          exit 1
