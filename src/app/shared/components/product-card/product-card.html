<article class="product-card group flex flex-col gap-3.5">

    <div class="product-image relative overflow-hidden rounded-editorial aspect-[4/5] border border-border-color/80 bg-surface-element transition-colors duration-300 group-hover:border-accent/65">

        <a [routerLink]="['/products', product().id]" class="absolute inset-0" tabindex="-1" aria-hidden="true">
            @if (showImage()) {
            <img [ngSrc]="imageUrl()" [alt]="altText()" fill [priority]="priority()"
                (error)="onImageError()"
                class="object-cover transition-transform duration-700 ease-out group-hover:scale-[1.03]" />
            } @else {
            <div class="flex h-full flex-col items-center justify-center gap-2 text-text-secondary">
                <span class="material-symbols-outlined text-2xl">image_not_supported</span>
                <span class="text-xs">{{ 'common.imageUnavailable' | translate }}</span>
            </div>
            }
        </a>

        @if (showEditButton()) {
        <div class="absolute top-2.5 right-2.5 flex items-center gap-1 z-10">
            <a [routerLink]="['/seller/products', product().id, 'edit']"
                class="flex items-center justify-center size-8 rounded-full border border-border-color bg-surface-light/90 backdrop-blur-sm text-text-main hover:bg-surface-light transition-colors"
                (click)="$event.stopPropagation()" [attr.aria-label]="'common.editProduct' | translate" [title]="'common.editProduct' | translate">
                <span class="material-symbols-outlined text-base text-text-main">edit</span>
            </a>
        </div>
        }
    </div>

    <div class="product-info flex flex-col items-start gap-1 px-0.5">
        <p class="product-category font-body text-2xs font-semibold uppercase tracking-[0.12em] text-secondary">
            {{ product().category | categoryName }}
        </p>

        <a [routerLink]="['/products', product().id]" class="block no-underline">
            <h3 class="product-title font-headline text-lg font-semibold leading-snug text-text-main transition-colors duration-200 group-hover:text-primary">
                {{ product().title }}
            </h3>
        </a>

        <p class="product-price mt-0.5 font-body text-base font-semibold text-primary">
            <app-product-price [amount]="price().amount" [currencyCode]="price().currencyCode" />
        </p>
    </div>
</article>
