<a [routerLink]="['/products', product().id]" class="flex flex-col gap-3 group p-4 cursor-pointer no-underline">

    @if (imageUrl()) {
    <div class="relative overflow-hidden rounded-lg aspect-[2/3] bg-gray-100">

        <img [ngSrc]="imageUrl()" [alt]="altText()" fill [priority]="priority()"
            class="object-cover transition-transform duration-300 ease-in-out group-hover:scale-105" />

        <button
            class="absolute top-2 right-2 flex items-center justify-center size-8 rounded-full bg-white/70 backdrop-blur-sm text-text-light hover:bg-white transition-colors z-10"
            (click)="$event.preventDefault(); $event.stopPropagation()">
            <span class="material-symbols-outlined text-base text-text-light">favorite</span>
        </button>
    </div>
    }

    <div class="flex flex-col items-start">
        <p class="text-sm text-text-light/70 font-body">
            {{ product().category.name }}
        </p>

        <h3 class="font-body font-bold text-base leading-tight text-text-light">
            {{ product().title }}
        </h3>

        <p class="font-body font-bold text-primary">
            {{ priceNumber() | currency:'USD':'symbol':'1.2-2' }}
        </p>
    </div>
</a>
