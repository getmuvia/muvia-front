<article class="group flex flex-col gap-4">

    <div class="relative overflow-hidden rounded-editorial aspect-[4/5] bg-surface-element">

        <a [routerLink]="['/products', product().id]" class="absolute inset-0" tabindex="-1" aria-hidden="true">
            @if (showImage()) {
            <img [ngSrc]="imageUrl()" [alt]="altText()" fill [priority]="priority()"
                (error)="onImageError()"
                class="object-cover transition-transform duration-500 ease-out group-hover:scale-[1.025]" />
            } @else {
            <div class="flex h-full flex-col items-center justify-center gap-2 text-text-secondary">
                <span class="material-symbols-outlined text-2xl">image_not_supported</span>
                <span class="text-xs">Imagen no disponible</span>
            </div>
            }
        </a>

        @if (showEditButton()) {
        <div class="absolute top-2 right-2 flex items-center gap-1 z-10">
            <a [routerLink]="['/seller/products', product().id, 'edit']"
                class="flex items-center justify-center size-8 rounded-full bg-white/70 backdrop-blur-sm text-text-light hover:bg-white transition-colors"
                (click)="$event.stopPropagation()" aria-label="Editar producto" title="Editar producto">
                <span class="material-symbols-outlined text-base text-text-light">edit</span>
            </a>
        </div>
        }
    </div>

    <div class="flex flex-col items-start gap-1 px-0.5">
        <p class="text-sm text-text-light/70 font-body">
            {{ product().category.name }}
        </p>

        <a [routerLink]="['/products', product().id]" class="no-underline hover:text-primary">
            <h3 class="font-body font-semibold text-base leading-tight text-text-light">
                {{ product().title }}
            </h3>
        </a>

        <p class="font-body font-semibold text-primary">
            Bs {{ priceNumber() | number:'1.2-2' }}
        </p>
    </div>
</article>
