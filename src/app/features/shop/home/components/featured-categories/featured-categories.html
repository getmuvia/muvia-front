<section id="categorias" class="w-full scroll-mt-20 py-20 lg:py-28">
    <div class="muvia-wide-container mb-10 flex items-end justify-between gap-6">
        <div>
            <p class="mb-3 text-xs font-bold uppercase tracking-[0.18em] text-secondary">Explora por ambiente</p>
            <h2 class="text-text-light text-xl sm:text-4xl font-headline font-semibold leading-tight tracking-[-0.025em]">
                Categorías destacadas
            </h2>
        </div>
        <a routerLink="/products"
            class="hidden border-b border-primary/30 pb-1 text-xs font-bold uppercase tracking-[0.14em] text-primary transition-colors hover:border-primary sm:block">
            Ver todas
        </a>
    </div>

    <div class="muvia-wide-container grid grid-cols-1 gap-1 sm:grid-cols-2 lg:grid-cols-4">

        @for (cat of categories(); track cat.id) {

        <a [routerLink]="cat.link" [queryParams]="cat.queryParams"
            class="relative group block aspect-[6/7] cursor-pointer overflow-hidden rounded-editorial bg-surface-element">

            <img [ngSrc]="cat.image" [alt]="cat.name" fill
                class="object-cover transition-transform duration-700 ease-out group-hover:scale-105" />

            <div class="absolute inset-0 bg-[linear-gradient(to_top,rgba(22,18,15,0.72)_0%,transparent_58%)]"></div>

            <div class="absolute inset-0 flex flex-col justify-end p-6 lg:p-8">
                <p class="text-white text-lg font-body font-semibold leading-tight line-clamp-3">
                    {{ cat.name }}
                </p>
                <span class="mt-2 inline-flex items-center gap-1 text-xs font-semibold uppercase tracking-[0.12em] text-white/75 opacity-0 transition-opacity duration-300 group-hover:opacity-100">
                    Explorar <span class="material-symbols-outlined text-base">arrow_forward</span>
                </span>
            </div>

        </a>
        }

    </div>
</section>
