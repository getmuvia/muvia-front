<section id="categorias" class="w-full scroll-mt-20 py-20 lg:py-28">
  <div class="muvia-wide-container mb-10 flex items-end justify-between gap-6">
    <div>
      <p class="mb-3 font-bold uppercase tracking-[0.18em] text-ink type-caption">
        {{ 'home.exploreByCategory' | translate }}
      </p>
      <h2 class="text-ink tracking-[-0.025em] type-section-title">
        {{ 'home.featuredCategories' | translate }}
      </h2>
    </div>
    <a
      routerLink="/products"
      class="hidden border-b border-line pb-1 text-sm font-bold uppercase tracking-[0.14em] text-ink transition-colors hover:border-ink sm:block"
    >
      {{ 'home.viewAll' | translate }}
    </a>
  </div>

  <div class="muvia-wide-container grid grid-cols-1 gap-1 sm:grid-cols-2 lg:grid-cols-4">
    @for (cat of categories; track cat.code) {
      <a
        routerLink="/products"
        [queryParams]="{ category: cat.code }"
        class="relative group block aspect-[6/7] cursor-pointer overflow-hidden rounded-editorial bg-paper"
      >
        <img
          [ngSrc]="cat.image"
          [alt]="cat | categoryName"
          fill
          class="object-cover transition-transform duration-700 ease-out group-hover:scale-105"
        />

        <div
          class="absolute inset-0 photo-fade"
        ></div>

        <div class="absolute inset-0 flex flex-col justify-end p-6 lg:p-8">
          <p class="text-canvas text-lg font-body font-semibold leading-tight line-clamp-3">
            {{ cat | categoryName }}
          </p>
          <span
            class="mt-2 inline-flex items-center gap-1 text-sm font-semibold uppercase tracking-[0.12em] text-canvas opacity-0 transition-opacity duration-300 group-hover:opacity-100"
          >
            {{ 'home.explore' | translate }}
            <span class="material-symbols-outlined icon-sm">arrow_forward</span>
          </span>
        </div>
      </a>
    }
  </div>
</section>
