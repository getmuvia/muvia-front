<section
  class="relative isolate flex h-[min(82svh,920px)] min-h-[620px] w-full items-center justify-center overflow-hidden text-center sm:min-h-[640px]"
>
  <img
    [ngSrc]="heroImage"
    [alt]="heroImageAlt | uiText"
    fill
    priority
    sizes="100vw"
    class="z-0 object-cover"
  />

  <div class="pointer-events-none absolute inset-0 z-10 bg-ink opacity-20"></div>
  <div class="hero-vignette pointer-events-none absolute inset-0 z-10 bg-ink opacity-55"></div>

  <div class="relative z-20 flex max-w-5xl animate-fade-in-up flex-col items-center gap-6 px-6">
    <h1 class="text-canvas tracking-[-0.035em] type-page-title md:type-hero-title">
      {{ 'home.designYourDreamSpace' | translate }}
    </h1>

    <p
      class="max-w-2xl text-canvas font-body font-normal leading-relaxed type-body"
    >
      {{ 'home.discoverUniquePiecesToTransformYourHomeWithStyle' | translate }}
    </p>

    <div class="pt-2 flex flex-wrap gap-4 justify-center">
      <a
        routerLink="/products"
        class="inline-flex items-center gap-2 border-b border-canvas pb-1.5 text-sm font-bold uppercase tracking-[0.14em] text-canvas underline-offset-4 hover:underline"
      >
        <span>{{ 'home.exploreNow' | translate }}</span>
        <span class="material-symbols-outlined icon-sm" aria-hidden="true">arrow_forward</span>
      </a>
    </div>
  </div>
</section>
