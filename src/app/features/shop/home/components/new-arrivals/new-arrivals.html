<section class="w-full py-16 md:py-24 bg-surface-light">
    <h2
        class="text-text-light text-xl sm:text-4xl font-headline font-semibold leading-tight tracking-[-0.015em] px-4 pb-10 text-center">
        Novedades
    </h2>

    <div class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">

            @for (product of products(); track product.id) {
            <app-product-card [product]="product" />
            } @empty {
            <p class="col-span-full text-center text-text-light/60 py-16">
                No hay novedades por el momento.
            </p>
            }

        </div>
    </div>
</section>
