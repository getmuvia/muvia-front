<section id="colecciones" class="w-full scroll-mt-20 bg-primary-deep text-white">
    <div class="muvia-wide-container grid px-0 md:min-h-[620px] md:grid-cols-[minmax(0,1.15fr)_minmax(0,0.85fr)] xl:min-h-[720px]">
        <div class="relative aspect-square overflow-hidden bg-[#ded3c1] md:aspect-auto md:min-h-[620px] xl:min-h-[720px]">
            <img [ngSrc]="promo().image" [alt]="promo().title" fill sizes="(min-width: 768px) 58vw, 100vw"
                class="object-contain object-center transition-transform duration-700 hover:scale-[1.015]" />
        </div>

        <div class="flex items-center px-6 py-16 sm:px-10 md:px-14 lg:px-20 xl:px-28 2xl:px-32">
            <div class="max-w-2xl">
                <p class="mb-4 text-xs font-bold uppercase tracking-[0.2em] text-accent">Edición de temporada</p>
                <h2 class="font-headline text-[clamp(2.5rem,4vw,5rem)] font-semibold leading-[0.98] tracking-[-0.035em] text-white">
                    {{ promo().title }}
                </h2>

                <p class="mt-6 max-w-xl font-body text-base leading-7 text-white/72 lg:text-lg">
                    {{ promo().description }}
                </p>

                <div class="mt-9">
                    <a [routerLink]="promo().link" [queryParams]="promo().queryParams"
                        class="inline-flex h-12 items-center justify-center rounded-full bg-white px-7 text-xs font-bold uppercase tracking-[0.14em] text-primary transition-all hover:-translate-y-0.5 hover:bg-surface-element">
                        Ver colección
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
