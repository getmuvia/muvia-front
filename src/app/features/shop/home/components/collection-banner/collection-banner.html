<section class="w-full py-16 md:py-24 px-4 sm:px-6 lg:px-8">

    <div class="relative max-w-[1440px] mx-auto bg-surface-element overflow-hidden w-full rounded-3xl shadow-soft">

        <!-- Layout para pantallas medianas y grandes: imagen completa con contenido al lado -->
        <div class="hidden md:flex items-stretch">

            <!-- Imagen - altura define el contenedor, ancho se adapta -->
            <div class="relative w-1/2 min-h-[500px]">
                <img [src]="promo().image" [alt]="promo().title" class="absolute inset-0 h-full w-full object-cover" />
            </div>

            <!-- Contenido - se expande para llenar el espacio restante -->
            <div class="flex-1 p-8 lg:p-12 xl:p-16 flex flex-col justify-center">

                <h2 class="text-xl lg:text-4xl font-headline font-semibold tracking-tight text-text-light">
                    {{ promo().title }}
                </h2>

                <p class="mt-4 text-text-light/80 font-body">
                    {{ promo().description }}
                </p>

                <div class="mt-6">
                    <a [routerLink]="promo().link" [queryParams]="promo().queryParams"
                        class="inline-flex rounded-full bg-primary px-6 py-3 text-sm font-semibold uppercase tracking-[0.1em] text-white shadow-sm hover:-translate-y-0.5 hover:shadow-soft transition-all font-body cursor-pointer">
                        Ver colección
                    </a>
                </div>

            </div>

        </div>

        <!-- Layout para móvil: apilado verticalmente -->
        <div class="md:hidden">
            <div class="relative w-full aspect-square">
                <img [ngSrc]="promo().image" [alt]="promo().title" width="600" height="600"
                    class="w-full h-full object-cover" />
            </div>
            <div class="p-8 text-center flex flex-col gap-4">
                <h2 class="text-xl font-headline font-semibold tracking-tight text-text-light">
                    {{ promo().title }}
                </h2>
                <p class="text-text-light/80 font-body">
                    {{ promo().description }}
                </p>
                <div class="mt-2">
                    <a [routerLink]="promo().link" [queryParams]="promo().queryParams"
                        class="inline-flex rounded-full bg-primary px-6 py-3 text-sm font-semibold uppercase tracking-[0.1em] text-white shadow-sm hover:shadow-soft transition-all font-body cursor-pointer">
                        Ver colección
                    </a>
                </div>
            </div>
        </div>

    </div>
</section>
