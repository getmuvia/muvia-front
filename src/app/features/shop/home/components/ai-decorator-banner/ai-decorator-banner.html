<section id="visualizador" class="w-full scroll-mt-20 bg-canvas py-16 lg:py-24">
  <div class="muvia-wide-container">
    <div
      class="grid overflow-hidden border border-line md:min-h-[540px] md:grid-cols-[minmax(0,1.12fr)_minmax(0,0.88fr)] xl:min-h-[620px]"
    >
      <div
        class="relative aspect-square overflow-hidden bg-mist md:aspect-auto md:min-h-[540px] xl:min-h-[620px]"
      >
        <img
          [ngSrc]="promo.resultImage"
          [alt]="promo.resultImageAlt | uiText"
          fill
          sizes="(min-width: 768px) 58vw, 100vw"
          class="object-cover object-center"
        />
        <span
          class="absolute right-4 top-4 rounded-control border border-line bg-canvas px-3 py-1.5 text-sm font-bold uppercase tracking-[0.12em] text-ink sm:right-6 sm:top-6"
        >
          {{ 'home.aiResult' | translate }}
        </span>

        <figure
          class="absolute bottom-4 left-4 w-[36%] max-w-52 overflow-hidden rounded-panel border-2 border-canvas bg-canvas sm:bottom-6 sm:left-6"
        >
          <div class="relative aspect-square">
            <img
              [ngSrc]="promo.beforeImage"
              [alt]="promo.beforeImageAlt | uiText"
              fill
              sizes="(min-width: 768px) 20vw, 36vw"
              class="object-cover"
            />
          </div>
          <figcaption
            class="px-3 py-1.5 text-sm font-bold uppercase tracking-[0.12em] text-ink"
          >
            {{ 'home.originalRoom' | translate }}
          </figcaption>
        </figure>

        <div
          class="absolute bottom-6 right-6 hidden w-56 items-center gap-3 rounded-panel border border-line bg-canvas p-3 text-ink sm:flex"
        >
          <img
            [ngSrc]="promo.productImage"
            [alt]="promo.productImageAlt | uiText"
            width="80"
            height="60"
            class="h-14 w-20 shrink-0 rounded-control object-cover"
          />
          <div class="min-w-0">
            <p class="font-bold uppercase tracking-[0.12em] text-ink type-caption">
              {{ 'home.chosenProduct' | translate }}
            </p>
            <p class="mt-0.5 truncate font-semibold text-ink type-caption">
              {{ 'home.desk' | translate }}
            </p>
          </div>
        </div>
      </div>

      <div class="flex items-center bg-graphite px-6 py-12 text-on-graphite sm:px-10 md:px-12 lg:px-16 xl:px-20">
        <div class="max-w-xl">
          <p class="mb-3 font-semibold text-on-graphite type-caption">
            {{ promo.eyebrow | uiText }}
          </p>
          <h2 class="tracking-[-0.03em] type-section-title">
            {{ promo.title | uiText }}
          </h2>

          <p class="mt-5 max-w-lg font-body leading-7 type-body">
            {{ promo.description | uiText }}
          </p>

          <div class="mt-8">
            <a
              [routerLink]="promo.link"
              class="inline-flex min-h-(--control-height) items-center gap-2 rounded-control bg-action px-4 py-2 text-sm font-semibold text-on-action transition-colors hover:bg-action/90 focus-visible:outline-on-graphite"
            >
              <span>{{ promo.cta | uiText }}</span>
              <span class="material-symbols-outlined icon-sm" aria-hidden="true"
                >arrow_forward</span
              >
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
