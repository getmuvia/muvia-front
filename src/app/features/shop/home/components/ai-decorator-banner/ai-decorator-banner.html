<section id="visualizador" class="w-full scroll-mt-20 bg-background-light py-16 lg:py-24">
    <div class="muvia-wide-container">
        <div class="grid overflow-hidden border border-accent/35 bg-primary-deep text-white shadow-float md:min-h-[540px] md:grid-cols-[minmax(0,1.12fr)_minmax(0,0.88fr)] xl:min-h-[620px]">
            <div class="relative aspect-square overflow-hidden bg-black/20 md:aspect-auto md:min-h-[540px] xl:min-h-[620px]">
                <img [ngSrc]="promo.resultImage" [alt]="(promo.resultImageAlt) | uiText" fill
                    sizes="(min-width: 768px) 58vw, 100vw" class="object-cover object-center" />
                <div class="absolute inset-0 bg-gradient-to-t from-black/45 via-transparent to-black/10"></div>

                <span class="absolute right-4 top-4 rounded-control border border-accent/45 bg-primary-deep/90 px-3 py-1.5 text-2xs font-bold uppercase tracking-[0.12em] text-accent shadow-lg backdrop-blur-sm sm:right-6 sm:top-6">
                    {{ 'home.aiResult' | translate }}
                </span>

                <figure class="absolute bottom-4 left-4 w-[36%] max-w-52 overflow-hidden rounded-panel border-2 border-surface-light bg-surface-light shadow-2xl sm:bottom-6 sm:left-6">
                    <div class="relative aspect-square">
                        <img [ngSrc]="promo.beforeImage" [alt]="(promo.beforeImageAlt) | uiText" fill
                            sizes="(min-width: 768px) 20vw, 36vw" class="object-cover" />
                    </div>
                    <figcaption class="px-3 py-1.5 text-2xs font-bold uppercase tracking-[0.12em] text-primary">
                        {{ 'home.originalRoom' | translate }}
                    </figcaption>
                </figure>

                <div class="absolute bottom-6 right-6 hidden w-56 items-center gap-3 rounded-panel border border-border-color bg-surface-light/95 p-3 text-primary shadow-2xl backdrop-blur-sm sm:flex">
                    <img [ngSrc]="promo.productImage" [alt]="(promo.productImageAlt) | uiText" width="80" height="60"
                        class="h-14 w-20 shrink-0 rounded-control object-cover" />
                    <div class="min-w-0">
                        <p class="text-2xs font-bold uppercase tracking-[0.12em] text-secondary">{{ 'home.chosenProduct' | translate }}</p>
                        <p class="mt-0.5 truncate text-sm font-semibold text-text-main">{{ 'home.desk' | translate }}</p>
                    </div>
                </div>
            </div>

            <div class="flex items-center px-6 py-12 sm:px-10 md:px-12 lg:px-16 xl:px-20">
                <div class="max-w-xl">
                    <p class="mb-3 text-xs font-bold uppercase tracking-[0.2em] text-accent">{{ (promo.eyebrow) | uiText }}</p>
                    <h2 class="font-headline text-3xl font-semibold tracking-[-0.03em] text-white">
                        {{ (promo.title) | uiText }}
                    </h2>

                    <p class="mt-5 max-w-lg font-body text-sm leading-7 text-white/75 lg:text-base">
                        {{ (promo.description) | uiText }}
                    </p>

                    <div class="mt-8">
                        <a [routerLink]="promo.link"
                            class="inline-flex items-center gap-2 border-b border-accent/70 pb-1.5 text-xs font-bold uppercase tracking-[0.14em] text-white transition-colors hover:border-accent hover:text-accent">
                            <span>{{ (promo.cta) | uiText }}</span>
                            <span class="material-symbols-outlined text-base text-accent" aria-hidden="true">arrow_forward</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
