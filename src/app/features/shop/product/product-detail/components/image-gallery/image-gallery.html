<div class="flex flex-col gap-4">
    <!-- Main Image -->
    @if (selectedAsset) {
    <div class="group relative w-full bg-center bg-no-repeat bg-cover flex flex-col justify-end overflow-hidden aspect-square bg-text-light/5 shadow-sm"
        [style.background-image]="'url(' + selectedAsset.url + ')'">

        <!-- Overlay with 3D/AR buttons (only if 3D model exists) -->
        @if (hasModel3d()) {
        <div
            class="absolute inset-x-0 bottom-0 p-6 flex items-end justify-end bg-gradient-to-t from-black/50 to-transparent">
            <div class="flex gap-3">
                <button (click)="openModel3dViewer()"
                    class="flex items-center justify-center size-12 bg-white/10 backdrop-blur-md border border-white/20 text-white hover:bg-primary hover:border-primary transition-all duration-300"
                    title="Ver en 3D">
                    <span class="material-symbols-outlined text-2xl">3d_rotation</span>
                </button>
                <button (click)="activateAr()"
                    class="flex items-center justify-center size-12 bg-white/10 backdrop-blur-md border border-white/20 text-white hover:bg-secondary hover:border-secondary transition-all duration-300"
                    title="Ver en AR">
                    <span class="material-symbols-outlined text-2xl">view_in_ar</span>
                </button>
            </div>
        </div>
        }
    </div>
    } @else {
    <div class="w-full aspect-square bg-text-light/5 flex items-center justify-center">
        <span class="material-symbols-outlined text-6xl text-text-light/20">image</span>
    </div>
    }

    <!-- Thumbnails (only image assets) -->
    @if (hasMultipleImages) {
    <div class="grid grid-cols-[repeat(auto-fit,minmax(80px,1fr))] gap-4">
        @for (asset of imageAssets(); track asset.id; let i = $index) {
        <div class="flex flex-col">
            <button (click)="selectImage(i)"
                class="w-full bg-center bg-no-repeat aspect-square bg-cover cursor-pointer transition-opacity" [class]="selectedIndex() === i 
                    ? 'border-2 border-primary' 
                    : 'border-2 border-transparent hover:border-text-light/20 hover:opacity-80'"
                [style.background-image]="'url(' + asset.url + ')'" [attr.aria-label]="'Ver imagen ' + (i + 1)">
            </button>
        </div>
        }
    </div>
    }
</div>

<!-- 3D Model Viewer Modal -->
@if (showModel3dViewer()) {
<div class="fixed inset-0 z-50 bg-black/95 flex items-center justify-center">
    <!-- Close button -->
    <button (click)="closeModel3dViewer()"
        class="absolute top-4 right-4 z-10 flex items-center justify-center size-12 bg-white/10 backdrop-blur-md border border-white/20 text-white hover:bg-white/20 transition-all duration-300"
        title="Cerrar">
        <span class="material-symbols-outlined text-2xl">close</span>
    </button>

    <!-- Title -->
    <div class="absolute top-4 left-4 z-10 text-white font-body">
        <span class="text-sm uppercase tracking-wider opacity-60">Vista 3D</span>
    </div>

    <!-- Model Viewer (only if loaded) -->
    @if (modelViewerLoaded()) {
    <model-viewer [attr.src]="glbAsset()?.url" [attr.ios-src]="usdzAsset()?.url" alt="Modelo 3D del producto"
        camera-controls auto-rotate ar ar-modes="webxr scene-viewer quick-look"
        style="width: 100%; height: 100%; max-width: 90vw; max-height: 90vh;">

        <!-- AR Button Slot -->
        <button slot="ar-button"
            class="absolute bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 bg-secondary text-white font-bold uppercase tracking-wider text-sm hover:bg-secondary/90 transition-colors font-body flex items-center gap-2">
            <span class="material-symbols-outlined">view_in_ar</span>
            Ver en tu espacio
        </button>
    </model-viewer>
    } @else {
    <!-- Loading state -->
    <div class="flex flex-col items-center gap-4">
        <span class="material-symbols-outlined text-4xl text-white animate-spin">progress_activity</span>
        <p class="text-white/60 font-body">Cargando visor 3D...</p>
    </div>
    }
</div>
}
