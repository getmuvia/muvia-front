<div class="flex flex-col gap-4">
    <!-- Main Image -->
    @if (selectedAsset) {
    <div class="group relative w-full bg-center bg-no-repeat bg-cover flex flex-col justify-end overflow-hidden aspect-square bg-text-light/5 shadow-sm"
        [style.background-image]="'url(' + selectedAsset.url + ')'">
        <!-- Overlay with 3D/AR buttons -->
        <div
            class="absolute inset-x-0 bottom-0 p-6 flex items-end justify-between bg-gradient-to-t from-black/50 to-transparent">
            <div
                class="flex items-center gap-2 px-3 py-1.5 bg-white/10 backdrop-blur-md border border-white/20 text-white text-xs font-bold uppercase tracking-widest font-body">
                <span class="material-symbols-outlined text-sm">view_in_ar</span>
                Vista Inmersiva
            </div>
            <div class="flex gap-3">
                <button
                    class="flex items-center justify-center size-12 bg-white/10 backdrop-blur-md border border-white/20 text-white hover:bg-primary hover:border-primary transition-all duration-300"
                    title="Ver en 3D">
                    <span class="material-symbols-outlined text-2xl">3d_rotation</span>
                </button>
                <button
                    class="flex items-center justify-center size-12 bg-white/10 backdrop-blur-md border border-white/20 text-white hover:bg-secondary hover:border-secondary transition-all duration-300"
                    title="Ver en AR">
                    <span class="material-symbols-outlined text-2xl">view_in_ar</span>
                </button>
            </div>
        </div>
    </div>
    } @else {
    <div class="w-full aspect-square bg-text-light/5 flex items-center justify-center">
        <span class="material-symbols-outlined text-6xl text-text-light/20">image</span>
    </div>
    }

    <!-- Thumbnails -->
    @if (hasMultipleImages) {
    <div class="grid grid-cols-[repeat(auto-fit,minmax(80px,1fr))] gap-4">
        @for (asset of assets(); track asset.id; let i = $index) {
        <div class="flex flex-col">
            <button (click)="selectImage(i)"
                class="w-full bg-center bg-no-repeat aspect-square bg-cover cursor-pointer transition-opacity" [class]="selectedIndex() === i 
                            ? 'border-2 border-primary' 
                            : 'border-2 border-transparent hover:border-text-light/20 hover:opacity-80'"
                [style.background-image]="'url(' + asset.url + ')'" [attr.aria-label]="'Ver imagen ' + (i + 1)">
            </button>
        </div>
        }
    </div>
    }
</div>
