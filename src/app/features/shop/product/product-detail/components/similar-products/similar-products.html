@if (products().length > 0) {
  <div class="mb-12 mt-24 border-t border-line pt-12">
    <div class="flex items-center justify-between mb-8">
      <h2 class="text-ink tracking-tight type-section-title">
        {{ 'catalog.similarProducts' | translate }}
      </h2>
      <a
        routerLink="/products"
        class="text-ink font-bold text-sm hover:underline uppercase tracking-wide cursor-pointer font-body"
        >{{ 'catalog.viewAll' | translate }}</a
      >
    </div>
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
      @for (product of products(); track product.id) {
        <app-product-card [product]="product" />
      }
    </div>
  </div>
}
