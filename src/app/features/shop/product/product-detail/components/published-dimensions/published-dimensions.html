<dl
  class="grid grid-cols-10 gap-1 sm:grid-cols-3 sm:gap-2"
  [attr.aria-label]="'catalog.publishedDimensions' | translate"
>
  @for (measurement of measurements(); track measurement.key) {
    <div
      class="min-w-0 border border-border-color bg-background-light px-1 py-2.5 sm:col-span-1 sm:px-3"
      [class]="measurement.key === 'depth' ? 'col-span-4' : 'col-span-3'"
    >
      <dt class="text-sm wrap-anywhere text-text-secondary">{{ measurement.label | translate }}</dt>
      <dd class="mt-0.5 text-base font-semibold wrap-anywhere text-primary sm:text-lg">{{ measurement.value }}</dd>
    </div>
  }
</dl>
