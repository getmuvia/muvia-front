@if (isLoading()) {
<!-- Loading skeleton -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-y-12 gap-x-8">
    @for (i of [1,2,3,4,5,6,7,8]; track i) {
    <div class="flex flex-col gap-3">
        <app-skeleton height="auto" className="aspect-[2/3]" />
        <div class="space-y-2">
            <app-skeleton width="33%" height="0.75rem" />
            <app-skeleton width="66%" height="1rem" />
            <app-skeleton width="25%" height="1rem" />
        </div>
    </div>
    }
</div>
} @else if (products().length === 0) {
<!-- Empty state -->
<app-empty-state title="No hay productos"
    description="No encontramos productos que coincidan con tu búsqueda. Intenta con otros filtros." />
} @else {
<!-- Product grid -->
<div [class]="viewMode() === 'grid' 
        ? 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-y-12 gap-x-8' 
        : 'flex flex-col gap-4'">
    @for (product of products(); track product.id) {
    <app-product-card [product]="product" />
    }
</div>
}
