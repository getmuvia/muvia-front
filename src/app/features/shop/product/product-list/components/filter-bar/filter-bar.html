<div class="catalog-filters">
  <div class="search-controls">
    <form
      (submit)="onSearchSubmit($event)"
      role="search"
      aria-label="Buscar en el catálogo"
      class="catalog-search"
    >
      <label for="product-search" class="sr-only">Buscar productos</label>
      <span class="material-symbols-outlined search-icon" aria-hidden="true">search</span>
      <input
        type="text"
        maxlength="200"
        [value]="searchQuery()"
        (input)="onSearchInput($event)"
        id="product-search"
        [placeholder]="searchPlaceholder()"
        enterkeyhint="search"
      />
      <button type="submit" aria-label="Buscar">Buscar</button>
    </form>
    <button
      type="button"
      (click)="measureRequested.emit()"
      class="measure-button"
      aria-label="Configurar filtro por medidas"
    >
      <span class="material-symbols-outlined" aria-hidden="true">straighten</span>
      Buscar por medidas
    </button>
  </div>

  @if (activeSearch() || activeCategory() || activeMeasurement()) {
    <div class="active-filters" aria-label="Filtros activos">
      <span class="active-filters-label">Filtrando por</span>
      @if (activeSearch()) {
        <button
          type="button"
          (click)="onClearSearch()"
          aria-label="Limpiar búsqueda"
          title="Limpiar búsqueda"
        >
          <span class="truncate">{{ activeSearch() }}</span>
          <span class="material-symbols-outlined" aria-hidden="true">close</span>
        </button>
      }
      @if (activeCategory()) {
        <button
          type="button"
          (click)="onClearCategory()"
          [attr.aria-label]="'Quitar filtro de categoría ' + activeCategory()"
          [attr.title]="'Quitar filtro de categoría ' + activeCategory()"
        >
          <span class="truncate">{{ activeCategory() }}</span>
          <span class="material-symbols-outlined" aria-hidden="true">close</span>
        </button>
      }
      @if (activeMeasurement()) {
        <button
          type="button"
          (click)="onClearMeasurement()"
          [attr.aria-label]="'Quitar filtro ' + activeMeasurement()"
          [attr.title]="'Quitar filtro ' + activeMeasurement()"
        >
          <span class="truncate">{{ activeMeasurement() }}</span>
          <span class="material-symbols-outlined" aria-hidden="true">close</span>
        </button>
      }
    </div>
  }
</div>
