<div class="flex flex-col gap-3 border-b border-border-color py-4 sm:py-5">
    <div class="flex w-full flex-col gap-3 sm:flex-row sm:items-center">
        <div class="w-full sm:max-w-sm sm:flex-1">
            <form (submit)="onSearchSubmit($event)" role="search" aria-label="Buscar en el catálogo" class="relative w-full">
                <label for="product-search" class="sr-only">Buscar productos</label>
                <input type="text" maxlength="200" [value]="searchQuery()" (input)="onSearchInput($event)"
                    id="product-search" placeholder="Buscar productos..." enterkeyhint="search"
                    class="h-11 w-full rounded-control border border-border-color bg-surface-light py-2 pl-5 pr-11 text-sm text-text-light transition-colors placeholder:text-text-secondary hover:border-text-light/30 focus:border-primary focus:outline-none focus:ring-4 focus:ring-primary/10" />
                <button type="submit" aria-label="Buscar" title="Buscar"
                    class="absolute right-1.5 top-1/2 flex size-8 -translate-y-1/2 items-center justify-center rounded-control text-text-light/50 transition-colors hover:bg-surface-element hover:text-primary">
                    <span class="material-symbols-outlined text-lg" aria-hidden="true">search</span>
                </button>
            </form>
        </div>

        <button type="button" (click)="measureRequested.emit()"
            class="flex h-11 w-full items-center justify-center gap-2 rounded-control border border-primary px-4 text-xs font-bold uppercase tracking-[0.1em] text-primary transition-colors hover:bg-primary/5 sm:w-auto"
            aria-label="Medir mi espacio para filtrar productos">
            <span class="material-symbols-outlined text-xl" aria-hidden="true">straighten</span>
            Medir mi espacio
        </button>
    </div>

    @if (activeSearch() || activeCategory() || activeMeasurement()) {
    <div class="flex min-w-0 flex-wrap items-center gap-3" aria-label="Filtros activos">
        @if (activeSearch()) {
        <button type="button" (click)="onClearSearch()" aria-label="Limpiar búsqueda"
            class="h-9 px-4 bg-surface-element border border-border-color text-text-light text-xs font-bold uppercase tracking-wider font-body hover:border-primary hover:text-primary transition-colors flex items-center gap-2 rounded-control group max-w-[200px] sm:max-w-[300px]"
            title="Limpiar búsqueda">
            <span class="truncate">{{ activeSearch() }}</span>
            <span
                class="material-symbols-outlined text-base opacity-40 group-hover:opacity-100 group-hover:text-error transition-colors" aria-hidden="true">close</span>
        </button>
        }

        @if (activeCategory()) {
        <button type="button" (click)="onClearCategory()"
            [attr.aria-label]="'Quitar filtro de categoría ' + activeCategory()"
            [attr.title]="'Quitar filtro de categoría ' + activeCategory()"
            class="group flex h-9 max-w-[240px] items-center gap-2 rounded-control border border-primary/30 bg-primary/10 px-4 font-body text-xs font-bold uppercase tracking-wider text-primary transition-colors hover:border-error/40 hover:bg-error/5 hover:text-error sm:max-w-[320px]">
            <span class="truncate">{{ activeCategory() }}</span>
            <span class="material-symbols-outlined text-base opacity-60 transition-opacity group-hover:opacity-100"
                aria-hidden="true">close</span>
        </button>
        }

        @if (activeMeasurement()) {
        <button type="button" (click)="onClearMeasurement()"
            [attr.aria-label]="'Quitar filtro ' + activeMeasurement()"
            [attr.title]="'Quitar filtro ' + activeMeasurement()"
            class="group flex h-9 max-w-[260px] items-center gap-2 rounded-control border border-primary/30 bg-primary/10 px-4 font-body text-xs font-bold uppercase tracking-wider text-primary transition-colors hover:border-error/40 hover:bg-error/5 hover:text-error sm:max-w-[340px]">
            <span class="truncate">{{ activeMeasurement() }}</span>
            <span class="material-symbols-outlined text-base opacity-60 transition-opacity group-hover:opacity-100"
                aria-hidden="true">close</span>
        </button>
        }
    </div>
    }
</div>
