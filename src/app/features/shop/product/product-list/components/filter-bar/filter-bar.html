<div class="catalog-filters">
  <div class="search-controls">
    <form
      (submit)="onSearchSubmit($event)"
      role="search"
      [attr.aria-label]="'catalog.searchTheCatalog' | translate"
      class="catalog-search"
    >
      <label for="product-search" class="sr-only">{{ 'catalog.searchProducts2' | translate }}</label>
      <span class="material-symbols-outlined search-icon" aria-hidden="true">search</span>
      <input
        type="text"
        maxlength="200"
        [value]="searchQuery()"
        (input)="onSearchInput($event)"
        id="product-search"
        [placeholder]="(searchPlaceholder()) | uiText"
        enterkeyhint="search"
      />
      <button type="submit" [attr.aria-label]="'catalog.search' | translate">{{ 'catalog.search' | translate }}</button>
    </form>
    <button
      type="button"
      (click)="measureRequested.emit()"
      class="measure-button"
      [attr.aria-label]="'catalog.setUpDimensionFilter' | translate"
    >
      <span class="material-symbols-outlined" aria-hidden="true">straighten</span>
      {{ 'catalog.searchByDimensions' | translate }}
    </button>
  </div>

  <div class="condition-filter">
    <label for="catalog-condition">{{ 'catalog.productCondition' | translate }}</label>
    <select id="catalog-condition" (change)="onConditionChange($event)">
      <option value="" [selected]="selectedCondition() === ''">{{ 'catalog.conditionAll' | translate }}</option>
      <option [value]="productCondition.NEW" [selected]="selectedCondition() === productCondition.NEW">{{ 'catalog.conditionFilterNew' | translate }}</option>
      <option [value]="productCondition.USED" [selected]="selectedCondition() === productCondition.USED">{{ 'catalog.conditionFilterUsed' | translate }}</option>
    </select>
  </div>

  @if (activeSearch() || activeCategory() || activeMeasurement()) {
    <div class="active-filters" [attr.aria-label]="'catalog.activeFilters' | translate">
      <span class="active-filters-label">{{ 'catalog.filteringBy' | translate }}</span>
      @if (activeSearch()) {
        <button
          type="button"
          (click)="onClearSearch()"
          [attr.aria-label]="'catalog.clearSearch' | translate"
          [title]="'catalog.clearSearch' | translate"
        >
          <span class="truncate">{{ activeSearch() }}</span>
          <span class="material-symbols-outlined" aria-hidden="true">close</span>
        </button>
      }
      @if (activeCategory()) {
        <button
          type="button"
          (click)="onClearCategory()"
          [attr.aria-label]="'catalog.removeCategoryFilter' | translate: {category: activeCategory()}"
          [attr.title]="'catalog.removeCategoryFilter' | translate: {category: activeCategory()}"
        >
          <span class="truncate">{{ activeCategory() }}</span>
          <span class="material-symbols-outlined" aria-hidden="true">close</span>
        </button>
      }
      @if (activeMeasurement()) {
        <button
          type="button"
          (click)="onClearMeasurement()"
          [attr.aria-label]="'catalog.removeFilter' | translate: {filter: activeMeasurement()}"
          [attr.title]="'catalog.removeFilter' | translate: {filter: activeMeasurement()}"
        >
          <span class="truncate">{{ activeMeasurement() }}</span>
          <span class="material-symbols-outlined" aria-hidden="true">close</span>
        </button>
      }
    </div>
  }
</div>
