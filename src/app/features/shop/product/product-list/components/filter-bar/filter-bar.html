<div class="sticky top-16 z-30 flex flex-col gap-3 border-b border-border-color bg-background-light/95 py-4 backdrop-blur-md transition-all sm:flex-row sm:items-center sm:justify-between sm:gap-6 sm:py-5">
    <!-- Search and active query -->
    <div class="flex min-w-0 flex-1 flex-wrap items-center gap-3">
        <!-- Search Input -->
        <div class="w-full sm:max-w-sm">
            <form (submit)="onSearchSubmit($event)" class="relative w-full">
                <label for="product-search" class="sr-only">Buscar productos</label>
                <input type="text" [value]="searchQuery()" (input)="onSearchInput($event)"
                    id="product-search" placeholder="Buscar productos..."
                    class="h-11 w-full rounded-control border border-border-color bg-surface-light px-4 py-2 pl-5 pr-11 text-sm text-text-light transition-all placeholder:text-text-light/40 hover:border-text-light/30 focus:border-primary focus:outline-none focus:ring-4 focus:ring-primary/10" />
                <button type="submit" aria-label="Buscar" title="Buscar"
                    class="absolute right-1.5 top-1/2 flex size-8 -translate-y-1/2 items-center justify-center rounded-full text-text-light/50 transition-colors hover:bg-surface-element hover:text-primary">
                    <span class="material-symbols-outlined text-lg">search</span>
                </button>
            </form>
        </div>

        <!-- Search Chip -->
        @if (activeSearch()) {
        <button (click)="onClearSearch()"
            class="h-9 px-4 bg-surface-element border border-border-color text-text-light text-xs font-bold uppercase tracking-wider font-body hover:border-primary hover:text-primary transition-colors flex items-center gap-2 rounded-full group max-w-[200px] sm:max-w-[300px]"
            title="Limpiar búsqueda">
            <span class="opacity-50 whitespace-nowrap hidden sm:inline">Búsqueda:</span>
            <span class="truncate">{{ activeSearch() }}</span>
            <span
                class="material-symbols-outlined text-base opacity-40 group-hover:opacity-100 group-hover:text-error transition-all">close</span>
        </button>
        }
    </div>

    <!-- Sort control -->
    <div class="flex shrink-0 items-center justify-between gap-3 sm:justify-end">
        <!-- Sort dropdown -->
        <label for="product-sort" class="text-xs font-bold uppercase tracking-wide text-text-light/50 font-body">
            Ordenar por
        </label>
        <div class="group relative">
            <select id="product-sort" [value]="selectedSort()" (change)="onSortChange($event)"
                class="h-11 cursor-pointer appearance-none rounded-control border border-border-color bg-surface-light py-2 pl-4 pr-10 text-sm font-semibold text-text-light transition-colors hover:border-text-light/30 focus:border-primary focus:outline-none focus:ring-4 focus:ring-primary/10 font-body">
                @for (option of sortOptions; track option.value) {
                <option [value]="option.value">{{ option.label }}</option>
                }
            </select>
            <span
                class="material-symbols-outlined pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-base text-text-light/60 transition-colors group-hover:text-primary">expand_more</span>
        </div>
    </div>
</div>
