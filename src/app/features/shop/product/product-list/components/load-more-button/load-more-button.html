@if (hasMore()) {
  <div class="flex justify-center mt-14">
    <button
      type="button"
      (click)="onLoadMore()"
      [disabled]="isLoading()"
      class="flex min-h-12 items-center gap-2.5 rounded-control border border-link bg-canvas px-8 py-3.5 font-semibold text-link transition-colors enabled:hover:bg-paper disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer type-control"
    >
      @if (isLoading()) {
        <span
          class="animate-spin material-symbols-outlined icon-sm text-ink"
          aria-hidden="true"
          >progress_activity</span
        >
        {{ 'catalog.loading' | translate }}
      } @else {
        {{ 'catalog.viewMoreProducts' | translate }}
        <span class="material-symbols-outlined icon-sm text-ink" aria-hidden="true"
          >arrow_downward</span
        >
      }
    </button>
  </div>
}
