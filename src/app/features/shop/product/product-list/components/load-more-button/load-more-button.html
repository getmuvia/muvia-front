@if (hasMore()) {
  <div class="flex justify-center mt-14">
    <button
      type="button"
      (click)="onLoadMore()"
      [disabled]="isLoading()"
      class="flex min-h-12 items-center gap-2.5 rounded-control border border-border-color bg-surface-light px-8 py-3.5 text-xs font-bold uppercase tracking-[0.14em] text-primary transition-colors hover:border-accent hover:bg-surface-element disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
    >
      @if (isLoading()) {
        <span class="animate-spin material-symbols-outlined text-base text-secondary" aria-hidden="true"
          >progress_activity</span
        >
        {{ 'catalog.loading' | translate }}
      } @else {
        {{ 'catalog.viewMoreProducts' | translate }}
        <span class="material-symbols-outlined text-base text-secondary" aria-hidden="true">arrow_downward</span>
      }
    </button>
  </div>
}
