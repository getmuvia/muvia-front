@if (hasMore()) {
  <div class="flex justify-center mt-12">
    <button
      type="button"
      (click)="onLoadMore()"
      [disabled]="isLoading()"
      class="flex min-h-12 items-center gap-2 border border-border-color px-7 py-3 text-sm font-semibold text-primary transition-colors hover:border-primary hover:bg-primary/5 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      @if (isLoading()) {
        <span class="animate-spin material-symbols-outlined text-base" aria-hidden="true"
          >progress_activity</span
        >
        Cargando...
      } @else {
        Ver más productos
        <span class="material-symbols-outlined text-base" aria-hidden="true">arrow_downward</span>
      }
    </button>
  </div>
}
