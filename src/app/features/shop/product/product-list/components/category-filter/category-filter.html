<div class="muvia-select-field" [attr.aria-busy]="isLoading()">
  <label for="catalog-category" class="muvia-select-label">{{ 'common.category' | translate }}</label>
  <select
    id="catalog-category"
    class="muvia-select-control"
    [value]="selectedCode()"
    (change)="onSelectionChange($event)"
    [disabled]="isLoading() || !!error()"
    [attr.aria-describedby]="error() ? 'catalog-category-error' : null"
  >
    <option value="" [selected]="!selectedCode()">
      {{ isLoading() ? ('common.loadingCategories' | translate) : ('common.allCategories' | translate) }}
    </option>
    @if (hasUnavailableSelection()) {
      <option [value]="selectedCode()" selected disabled>
        {{ isLoading() ? ('common.loadingCategory' | translate) : ('common.categoryUnavailable' | translate) }}
      </option>
    }
    @for (category of categories(); track category.id) {
      <option [value]="category.code" [selected]="category.code === selectedCode()">
        {{ category | categoryName }}
      </option>
    }
  </select>
</div>
@if (error(); as message) {
  <div class="category-error" role="alert">
    <p id="catalog-category-error">{{ (message) | uiText }}</p>
    <button type="button" (click)="retry.emit()">{{ 'common.retry' | translate }}</button>
  </div>
}
