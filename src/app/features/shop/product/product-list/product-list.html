<div class="flex flex-col w-full min-h-screen">
    <!-- Page Header -->
    <app-page-header [productCount]="totalProducts()" />

    <!-- Main content area with flex-grow to push footer down -->
    <main class="flex-grow max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full bg-white">
        <!-- Filter Bar -->
        <app-filter-bar [categories]="categories()" [activeFilters]="activeFilters()" [selectedSort]="selectedSort()"
            [viewMode]="viewMode()" (filterToggle)="onFilterToggle()" (removeFilter)="onRemoveFilter($event)"
            (sortChange)="onSortChange($event)" (viewModeChange)="onViewModeChange($event)" />

        <!-- Product Grid -->
        <div class="mt-8">
            <app-product-grid [products]="products()" [isLoading]="isLoading()" [viewMode]="viewMode()" />
        </div>

        <!-- Load More Button -->
        <app-load-more-button [isLoading]="isLoadingMore()" [hasMore]="hasMore()" (loadMore)="loadMore()" />
    </main>
</div>
