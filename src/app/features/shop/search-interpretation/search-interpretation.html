<section
  aria-label="Interpretación de la búsqueda"
  [class]="compact()
    ? 'border-b border-border-color bg-primary/5 px-4 py-3'
    : 'mt-5 rounded-control border border-primary/20 bg-primary/5 p-4 sm:p-5'"
>
  <div class="flex min-w-0 items-start gap-3">
    <span
      class="material-symbols-outlined mt-0.5 shrink-0 text-xl text-primary"
      aria-hidden="true"
    >
      psychology
    </span>

    <div class="min-w-0 flex-1">
      <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
        <h2
          [class]="compact()
            ? 'text-xs font-bold uppercase tracking-[0.1em] text-primary'
            : 'text-sm font-bold text-primary'"
        >
          Muvia entendió
        </h2>

        @if (editable() && !isEditing()) {
        <button
          type="button"
          (click)="startEditing()"
          class="rounded-control px-2 py-1 text-xs font-semibold text-primary transition-colors hover:bg-primary/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
        >
          Ajustar búsqueda
        </button>
        }
      </div>

      <p
        aria-live="polite"
        [class]="compact()
          ? 'mt-1 truncate text-sm text-text-light/75'
          : 'mt-1 text-sm leading-6 text-text-light/80'"
      >
        {{ interpretation().summary }}
      </p>

      @if (editable() && isEditing()) {
      <form (submit)="submitRefinement($event)" class="mt-4 border-t border-primary/15 pt-4">
        <label for="search-interpretation-query" class="text-xs font-semibold text-text-light/70">
          Corrige tu búsqueda con tus propias palabras
        </label>
        <div class="mt-2 flex flex-col gap-2 sm:flex-row">
          <input
            #queryInput
            id="search-interpretation-query"
            type="text"
            [attr.maxlength]="maxQueryLength"
            [value]="draftQuery()"
            (input)="onQueryInput($event)"
            autocomplete="off"
            enterkeyhint="search"
            class="h-11 min-w-0 flex-1 rounded-control border border-border-color bg-surface-light px-4 text-sm text-text-light outline-none transition-colors focus:border-primary focus:ring-4 focus:ring-primary/10"
          />
          <div class="flex gap-2">
            <button
              type="button"
              (click)="cancelEditing()"
              class="h-11 flex-1 rounded-control border border-border-color px-4 text-xs font-semibold text-text-light/70 transition-colors hover:border-text-light/30 hover:text-text-light sm:flex-none"
            >
              Cancelar
            </button>
            <button
              type="submit"
              [disabled]="!canSubmit()"
              class="h-11 flex-1 rounded-control bg-primary px-4 text-xs font-bold text-white transition-colors hover:bg-primary/90 disabled:cursor-not-allowed disabled:opacity-40 sm:flex-none"
            >
              Actualizar resultados
            </button>
          </div>
        </div>
      </form>
      }
    </div>
  </div>
</section>
