<section
  [attr.aria-label]="'catalog.searchInterpretation' | translate"
  [class]="
    compact()
      ? 'border-b border-line bg-mist px-4 py-3'
      : 'mt-5 rounded-control border border-line bg-mist p-4 sm:p-5'
  "
>
  @if (interpretation().source === 'deterministic') {
    <p role="status" class="text-ink type-body">
      {{ 'search.basicSearchHint' | translate }}
    </p>
  } @else {
    <div class="flex min-w-0 items-start gap-3">
      <span
        class="material-symbols-outlined mt-0.5 shrink-0 icon-lg text-ink"
        aria-hidden="true"
      >
        psychology
      </span>

      <div class="min-w-0 flex-1">
        <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
          <h2
            class="type-control"
            [class]="
              compact()
                ? 'text-sm font-bold uppercase tracking-[0.1em] text-ink'
                : 'text-sm font-bold text-ink'
            "
          >
            {{ 'catalog.muviaUnderstood' | translate }}
          </h2>

          @if (editable() && !isEditing()) {
            <button
              type="button"
              (click)="startEditing()"
              class="rounded-control px-2 py-1 font-semibold text-ink transition-colors hover:bg-mist focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink type-control"
            >
              {{ 'catalog.refineSearch' | translate }}
            </button>
          }
        </div>

        <p
          class="type-body"
          aria-live="polite"
          [class]="
            compact()
              ? 'mt-1 truncate text-sm text-ink'
              : 'mt-1 text-sm leading-6 text-ink'
          "
        >
          {{ summary() }}
        </p>

        @if (editable() && isEditing()) {
          <form (submit)="submitRefinement($event)" class="mt-4 border-t border-line pt-4">
            <label
              for="search-interpretation-query"
              class="text-sm font-semibold text-ink"
            >
              {{ 'catalog.refineYourSearchInYourOwnWords' | translate }}
            </label>
            <div class="mt-2 flex flex-col gap-2 sm:flex-row">
              <input
                #queryInput
                id="search-interpretation-query"
                type="text"
                [attr.maxlength]="maxQueryLength"
                [value]="draftQuery()"
                (input)="onQueryInput($event)"
                autocomplete="off"
                enterkeyhint="search"
                class="h-11 min-w-0 flex-1 rounded-control border border-line bg-canvas px-4 text-ink outline-none transition-colors focus:border-ink focus:ring-2 focus:ring-ink type-control"
              />
              <div class="flex gap-2">
                <button
                  type="button"
                  (click)="cancelEditing()"
                  class="h-11 flex-1 rounded-control border border-line px-4 font-semibold text-ink transition-colors hover:border-line hover:text-ink sm:flex-none type-control"
                >
                  {{ 'common.cancel' | translate }}
                </button>
                <button
                  type="submit"
                  [disabled]="!canSubmit()"
                  class="h-11 flex-1 rounded-control bg-ink px-4 font-bold text-canvas transition-colors hover:bg-sand hover:text-ink disabled:cursor-not-allowed disabled:opacity-40 sm:flex-none type-control"
                >
                  {{ 'catalog.updateResults' | translate }}
                </button>
              </div>
            </div>
          </form>
        }
      </div>
    </div>
  }
</section>
