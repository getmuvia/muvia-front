<app-product-form 
    [initialData]="formData()" 
    [categories]="categories()" 
    [isLoadingCategories]="isLoadingCategories()"
    [imageAssets]="imageAssets()" 
    [model3dGlbAsset]="model3dGlbAsset()" 
    [model3dUsdzAsset]="model3dUsdzAsset()"
    [keywords]="keywords()" 
    [isSubmitting]="isSubmitting()" 
    [isEditMode]="isEditMode()"
    (formSubmit)="onFormSubmit($event)" 
    (formCancel)="onCancel()" 
    (keywordsChange)="onKeywordsChange($event)"
    (imagesChange)="onImagesChange($event)" 
    (glbAssetChange)="onGlbAssetChange($event)"
    (usdzAssetChange)="onUsdzAssetChange($event)"
    (fileSelected)="onFileSelected($event)"
    (saveDraft)="onSaveDraft($event)">
</app-product-form>
