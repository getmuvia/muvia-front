<section class="liquid-glass p-8 space-y-6" [formGroup]="form">
    <div class="flex justify-between items-center border-b border-gray-200 pb-4 mb-6">
        <h3 class="text-lg font-body font-bold uppercase tracking-wider text-secondary">Información Básica</h3>
        <span class="material-symbols-outlined text-gray-400">info</span>
    </div>

    <div class="grid grid-cols-1 gap-6">
        <!-- Title -->
        <div class="space-y-2">
            <label class="text-sm font-body font-medium text-gray-600 uppercase tracking-wide">
                Título del Producto
            </label>
            <input formControlName="title"
                class="w-full bg-transparent border-0 border-b border-gray-300 focus:border-secondary focus:ring-0 px-0 py-3 text-lg text-gray-900 placeholder-gray-400 transition-colors font-body"
                placeholder="Ej. Lámpara de Pie Minimalista" type="text" />
        </div>

        <!-- Description -->
        <div class="space-y-2">
            <label class="text-sm font-body font-medium text-gray-600 uppercase tracking-wide">
                Descripción
            </label>
            <textarea formControlName="description"
                class="w-full bg-gray-50 border border-gray-200 focus:border-secondary focus:ring-0 p-4 text-base text-gray-900 placeholder-gray-400 resize-none font-body"
                placeholder="Describe la historia, inspiración y detalles de tu pieza..." rows="4"></textarea>
        </div>

        <!-- Price, Stock, Category Row -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Price -->
            <div class="space-y-2">
                <label class="text-sm font-body font-medium text-gray-600 uppercase tracking-wide">
                    Precio
                </label>
                <div class="relative">
                    <span class="absolute left-0 top-1/2 -translate-y-1/2 text-gray-400">$</span>
                    <input formControlName="price"
                        class="w-full bg-transparent border-0 border-b border-gray-300 focus:border-secondary focus:ring-0 pl-6 pr-0 py-3 text-lg text-gray-900 placeholder-gray-400 font-body"
                        placeholder="0.00" type="number" step="0.01" min="0" />
                </div>
            </div>

            <!-- Stock -->
            <div class="space-y-2">
                <label class="text-sm font-body font-medium text-gray-600 uppercase tracking-wide">
                    Stock
                </label>
                <input formControlName="stock"
                    class="w-full bg-transparent border-0 border-b border-gray-300 focus:border-secondary focus:ring-0 px-0 py-3 text-lg text-gray-900 placeholder-gray-400 font-body"
                    placeholder="1" type="number" min="0" />
            </div>

            <!-- Category -->
            <div class="space-y-2">
                <label class="text-sm font-body font-medium text-gray-600 uppercase tracking-wide">
                    Categoría
                </label>
                <select formControlName="categoryId"
                    class="w-full bg-transparent border-0 border-b border-gray-300 focus:border-secondary focus:ring-0 px-0 py-3 text-lg text-gray-900 font-body"
                    [disabled]="isLoadingCategories">
                    <option value="" disabled>Selecciona una categoría</option>
                    @for (category of categories; track category.id) {
                    <option [value]="category.id">{{ category.name }}</option>
                    }
                </select>
            </div>
        </div>
    </div>
</section>
