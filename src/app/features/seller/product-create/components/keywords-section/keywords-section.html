<div class="space-y-4">
  <label class="text-sm font-body font-medium text-ink uppercase tracking-wide">
    {{ 'seller.tagsKeywords' | translate }}
  </label>
  <div
    class="flex min-h-[80px] flex-wrap items-start gap-2 rounded-control border border-line bg-canvas p-4 transition-colors focus-within:border-ink"
  >
    @for (keyword of keywords(); track keyword) {
      <span
        class="flex items-center gap-1 rounded-control bg-ink px-3 py-1 text-sm text-canvas font-body"
      >
        {{ keyword }}
        <button
          type="button"
          (click)="removeKeyword(keyword)"
          class="hover:text-ink transition-colors"
        >
          <span class="material-symbols-outlined icon-xs">close</span>
        </button>
      </span>
    }
    <input
      [value]="newKeyword()"
      (input)="onInputChange($event)"
      (keydown)="onKeydown($event)"
      [attr.aria-invalid]="hasError()"
      [attr.aria-describedby]="hasError() ? 'product-keywords-error' : null"
      data-error-focus
      class="bg-transparent border-none focus:ring-0 placeholder-text-light/40 min-w-[150px] text-ink font-body flex-1 type-control"
      [placeholder]="'seller.typeAndPressEnter' | translate"
      type="text"
    />
  </div>
  <p class="text-ink font-body type-body">
    {{ 'seller.helpBuyersFindYourProductFaster' | translate }}
  </p>
</div>
