<div class="space-y-4">
        <label class="text-sm font-body font-medium text-text-light/70 uppercase tracking-wide">
            Etiquetas (Keywords)
        </label>
        <div
            class="flex min-h-[80px] flex-wrap items-start gap-2 rounded-lg border border-border-color bg-white p-4 transition-colors focus-within:border-primary">
            @for (keyword of keywords(); track keyword) {
            <span class="flex items-center gap-1 rounded-full bg-primary px-3 py-1 text-xs text-white font-body">
                {{ keyword }}
                <button type="button" (click)="removeKeyword(keyword)" class="hover:text-secondary transition-colors">
                    <span class="material-symbols-outlined text-sm">close</span>
                </button>
            </span>
            }
            <input [value]="newKeyword()" (input)="onInputChange($event)" (keydown)="onKeydown($event)"
                class="bg-transparent border-none text-sm focus:ring-0 placeholder-text-light/40 min-w-[150px] text-text-light font-body flex-1"
                placeholder="Escribe y presiona Enter..." type="text" />
        </div>
        <p class="text-xs text-text-light/60 font-body">
            Ayuda a los compradores a encontrar tu producto más rápido.
        </p>
</div>
