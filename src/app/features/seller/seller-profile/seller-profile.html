@if (isProfileLoading()) {
<!-- Cover Skeleton -->
<div class="seller-profile-shell">
    <app-skeleton height="16rem" className="w-full mb-8 rounded-control"></app-skeleton>
</div>

<!-- Header Skeleton -->
<div class="seller-profile-shell relative z-10 -mt-20 mb-8 flex flex-col items-end gap-6 px-4 md:flex-row md:px-8">
    <app-skeleton shape="circle" width="160px" height="160px"
        className="border-4 border-border-color shadow-lg"></app-skeleton>
    <div class="flex-1 w-full pb-4 space-y-3">
        <app-skeleton width="40%" height="2.5rem"></app-skeleton>
        <app-skeleton width="60%" height="1.25rem"></app-skeleton>
    </div>
    <div class="pb-4">
        <app-skeleton width="140px" height="42px" className="rounded-full"></app-skeleton>
    </div>
</div>
} @else {
<div class="seller-profile-shell seller-profile-hero overflow-hidden rounded-control bg-white">
    <app-seller-cover-banner [coverImage]="coverImageUrl()" (edit)="openEditModal('cover')"></app-seller-cover-banner>

    <app-seller-profile-header [avatarUrl]="avatarUrl()" [sellerName]="sellerName()" [description]="sellerDescription()"
        [hasCoverImage]="!!coverImageUrl()" (editAvatar)="openEditModal('avatar')">
    </app-seller-profile-header>
</div>
}

<app-image-editor-modal [isOpen]="isModalOpen()" [title]="modalTitle()" [isLoading]="isSaving()"
    [mode]="activeField() === 'coverImage' ? 'cover' : 'avatar'" (save)="onSaveImage($event)"
    (cancel)="isModalOpen.set(false)">
</app-image-editor-modal>

<div class="seller-profile-shell mt-8 flex flex-col gap-8 lg:flex-row lg:items-start">
    @if (isProfileLoading()) {
    <!-- Sidebar Skeleton -->
    <div class="w-full lg:w-80 space-y-6">
        <div class="space-y-4 rounded-panel bg-surface-element p-6">
            <app-skeleton width="50%" height="1.5rem"></app-skeleton>
            <div class="space-y-2">
                <app-skeleton width="100%" height="1rem"></app-skeleton>
                <app-skeleton width="90%" height="1rem"></app-skeleton>
                <app-skeleton width="95%" height="1rem"></app-skeleton>
            </div>
        </div>
        <div class="space-y-4 rounded-panel bg-surface-element p-6">
            <app-skeleton width="50%" height="1.5rem"></app-skeleton>
            <div class="space-y-2">
                <app-skeleton width="100%" height="2rem"></app-skeleton>
            </div>
        </div>
    </div>
    } @else {
    <app-seller-sidebar [aboutText]="aboutText()" [businessHours]="businessHours()" [socialLinks]="socialLinks()"
        (editInfo)="isSidebarModalOpen.set(true)">
    </app-seller-sidebar>
    }

    <section id="productos" class="seller-products min-w-0 flex-1" aria-label="Productos del vendedor">
        @if (isProductsLoading()) {
        <!-- Product Grid Skeleton -->
        <div class="seller-product-grid-skeleton mt-6 grid gap-6">
            @for (item of [1,2,3,4,5,6,7,8]; track item) {
            <div class="overflow-hidden rounded-editorial bg-surface-element">
                <app-skeleton height="16rem" className="w-full rounded-none"></app-skeleton>
                <div class="p-4 space-y-2">
                    <app-skeleton width="70%" height="1.25rem"></app-skeleton>
                    <app-skeleton width="40%" height="1rem"></app-skeleton>
                    <div class="flex justify-between items-center pt-2">
                        <app-skeleton width="30%" height="1.5rem"></app-skeleton>
                        <app-skeleton shape="circle" width="32px" height="32px"></app-skeleton>
                    </div>
                </div>
            </div>
            }
        </div>
        } @else {
        <app-seller-product-grid [products]="products()"></app-seller-product-grid>

        }
    </section>
</div>

<app-sidebar-edit-modal [isOpen]="isSidebarModalOpen()" [initialData]="sidebarData()" [isLoading]="isSaving()"
    (save)="onSaveSidebarInfo($event)" (closeModal)="isSidebarModalOpen.set(false)">
</app-sidebar-edit-modal>
