<div class="flex gap-2 p-1 overflow-x-auto">
  @for (chip of chips(); track chip.id) {
    <button
      (click)="onChipClick(chip.id)"
      [class]="
        chip.id === activeChipId()
          ? 'flex h-9 shrink-0 items-center justify-center gap-x-2 bg-mist pl-4 pr-3'
          : 'flex h-9 shrink-0 items-center justify-center gap-x-2 bg-paper pl-4 pr-3 hover:bg-paper transition-colors'
      "
    >
      <p
        class="type-body"
        [class]="
          chip.id === activeChipId()
            ? 'text-ink text-sm font-body font-medium leading-normal'
            : 'text-ink text-sm font-body font-medium leading-normal'
        "
      >
        {{ chip.label | uiText }}
      </p>
      @if (chip.hasDropdown) {
        <span class="material-symbols-outlined text-ink">arrow_drop_down</span>
      }
    </button>
  }
</div>
