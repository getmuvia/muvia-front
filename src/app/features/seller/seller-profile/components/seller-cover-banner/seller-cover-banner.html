<div
  class="w-full h-48 md:h-64 lg:h-[450px] flex flex-col justify-end overflow-hidden relative group/banner bg-canvas"
>
  @if (coverImageUrl()) {
    <img
      [src]="coverImageUrl()"
      [alt]="'seller.coverImage' | translate"
      (error)="onImageError()"
      class="w-full h-full object-cover absolute inset-0 z-10"
    />
  } @else {
    <div
      class="absolute inset-0 flex flex-col items-center justify-center text-ink gap-2 bg-canvas z-10"
    >
      <span class="material-symbols-outlined icon-2xl">store</span>
      <p class="font-medium font-body type-body">{{ 'seller.noCoverImage' | translate }}</p>
    </div>
  }

  <!-- Edit Button -->
  @if (editable()) {
    <app-edit-trigger-button
      (click)="edit.emit()"
      tooltip="Cambiar portada"
      customClass="bottom-4 right-4 group-hover/banner:opacity-100"
      [class.opacity-100]="!coverImageUrl()"
    >
    </app-edit-trigger-button>
  }
</div>
