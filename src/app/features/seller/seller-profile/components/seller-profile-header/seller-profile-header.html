<div class="flex p-4 z-10 relative group/header" [class.-mt-16]="hasCoverImage()">



    <div class="flex w-full flex-col gap-4 sm:flex-row sm:justify-between sm:items-end">
        <div class="flex gap-4 items-end">
            <div class="relative flex items-center justify-center bg-center bg-no-repeat aspect-square bg-cover rounded-full size-32 ring-4 ring-background-light bg-surface-element"
                [style.background-image]="avatarUrl() ? 'url(' + avatarUrl() + ')' : null">
                @if (!avatarUrl()) {
                <span class="material-symbols-outlined text-5xl text-text-light/50">storefront</span>
                }

                <!-- Edit Avatar Button -->
                <app-edit-trigger-button (click)="editAvatar.emit()" tooltip="Cambiar logo"
                    customClass="bottom-0 right-0 group-hover/header:opacity-100" icon="photo_camera">
                </app-edit-trigger-button>
            </div>
            <div class="flex flex-col justify-center pb-2">
                <p class="text-3xl font-headline font-bold leading-tight tracking-[-0.015em] text-text-light">
                    {{ sellerName() || 'Nombre del Vendedor' }}
                </p>
                <p class="text-base font-body font-normal leading-normal text-text-light/80">
                    {{ description() || 'Descripción del vendedor.' }}
                </p>
            </div>
        </div>
        <div class="flex w-full sm:w-auto max-w-[480px] gap-3">
            <button (click)="onFollow()"
                class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden h-10 px-4 bg-surface-element text-text-light text-sm font-body font-bold leading-normal tracking-[0.015em] flex-1 sm:flex-auto hover:bg-surface-element/80 transition-colors">
                <span class="truncate">Seguir</span>
            </button>
            <button (click)="onContact()"
                class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden h-10 px-4 bg-primary text-white text-sm font-body font-bold leading-normal tracking-[0.015em] flex-1 sm:flex-auto hover:opacity-90 transition-opacity">
                <span class="truncate">Contactar Vendedor</span>
            </button>
        </div>
    </div>
</div>
